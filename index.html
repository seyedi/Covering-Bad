<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Covering Bad</title>
	<link rel="stylesheet" href="coveringBad.css">
	<link rel="stylesheet" href="demo.css">
</head>
<body>

	<h1>Covering Bad</h1>
	<h2>Drag the handle</h2>

	<div class="covered first" data-passive="images/b2.jpg" data-active="images/b1.jpg">
		<div class="handle"></div>
		<div class="changeable"></div>
	</div>

	<div class="covered second" data-passive="images/m2.jpg" data-active="images/m1.jpg">
		<div class="handle"></div>
		<div class="changeable"></div>
	</div>

	<div class="covered third" data-passive="images/2.jpg" data-active="images/1.jpg">
		<div class="handle"></div>
		<div class="changeable"></div>
	</div>

	<div class="covered fourth" data-passive="images/l2.jpg" data-active="images/l1.jpg">
		<div class="handle"></div>
		<div class="changeable"></div>
	</div>

	<script src="coveringBad.js"></script>
	<script>
		new CoveringBad('.first', {
			marginY: 30,
			marginX: 30,
			setX: 200,
			setY: 100,
			direction: 'vertical'
		});

		new CoveringBad('.second', {
			marginY: 20,
			marginX: 20,
			setX: 210,
			setY: 140,
			direction: 'horizontal'
		});

		new CoveringBad('.third');

		new CoveringBad('.fourth', {
			marginY: 20,
			marginX: 400,
			setX: 400,
			setY: 235,
			direction: 'vertical'
		});
	</script>
</body>
</html>
